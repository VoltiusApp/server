---
# Move production from one host to another. See
# specs-archive/2026-09-22-scale-up-automation-design.md.
#
#   ansible-playbook migrate.yml -e voltius_source=oracle -e voltius_target=newhost
#
# Downtime starts at phase 4 and ends at phase 7.

- name: Phase 1 — preflight
  hosts: "{{ voltius_source }}:{{ voltius_target }}"
  gather_facts: true
  tasks:
    - name: Name both ends
      ansible.builtin.assert:
        that:
          - voltius_source is defined
          - voltius_target is defined
          - voltius_source != voltius_target
        fail_msg: pass -e voltius_source=<host> -e voltius_target=<host>

    - name: Check the source is serving
      when: inventory_hostname == voltius_source
      block:
        - name: Read the source container health
          ansible.builtin.command: >-
            docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' voltius-server voltius-db
          register: voltius_src_health
          changed_when: false

        - name: Both must be healthy
          ansible.builtin.assert:
            that: voltius_src_health.stdout_lines | unique == ["healthy"]
            fail_msg: "source is not healthy: {{ voltius_src_health.stdout_lines }}"

        - name: Check the newest base backup
          ansible.builtin.shell:
            cmd: |
              set -eu
              docker run --rm --env-file {{ voltius_root }}/voltius-db/.env.db {{ voltius_pg_walg_image }} bash -c '
                export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
                  AWS_ENDPOINT="$R2_ENDPOINT" AWS_S3_FORCE_PATH_STYLE=true AWS_REGION="${AWS_REGION:-auto}" \
                  WALG_COMPRESSION_METHOD=lz4
                wal-g backup-list' | tail -2
          register: voltius_backup_list
          changed_when: false

        - name: Show it
          ansible.builtin.debug:
            var: voltius_backup_list.stdout_lines

        - name: Read the source's .env.db
          ansible.builtin.include_tasks: tasks/read-db-env.yml

    - name: Check the target is prepared and idle
      when: inventory_hostname == voltius_target
      block:
        - name: The database volume must not exist yet
          ansible.builtin.command: docker volume inspect {{ voltius_db_volume }}
          register: voltius_tgt_volume
          changed_when: false
          failed_when: false

        - name: Stop if it does
          ansible.builtin.assert:
            that: voltius_tgt_volume.rc != 0
            fail_msg: "{{ voltius_db_volume }} already exists on the target"

        - name: Nothing of ours may be running there
          ansible.builtin.shell:
            cmd: docker ps --filter name=voltius --filter status=running --format '{{ "{{" }}.Names{{ "}}" }}'
          register: voltius_tgt_running
          changed_when: false

        - name: Stop if something is
          ansible.builtin.assert:
            that: voltius_tgt_running.stdout == ""
            fail_msg: "target already runs: {{ voltius_tgt_running.stdout_lines }}"

        - name: site.yml must have run
          ansible.builtin.stat:
            path: "{{ voltius_root }}/voltius-db/compose.db.yml"
          register: voltius_tgt_layout

        - name: Stop if it has not
          ansible.builtin.assert:
            that: voltius_tgt_layout.stat.exists
            fail_msg: run site.yml against the target first

        - name: Check free disk
          ansible.builtin.assert:
            that: >-
              ansible_facts.mounts | selectattr('mount', 'eq', '/') | map(attribute='size_available')
              | first > voltius_min_free_bytes
            fail_msg: "less than {{ (voltius_min_free_bytes / 1024 / 1024 / 1024) | round(1) }} GB free on /"

- name: Phase 2 — secrets
  hosts: "{{ voltius_target }}"
  gather_facts: false
  vars_prompt:
    - name: voltius_age_key
      prompt: |
        Paste the age private key (AGE-SECRET-KEY-…), then Enter.
        Leave empty if you passed voltius_age_key_file instead.
        It is written to RAM on the target, used once, and deleted
      private: true
      unsafe: true
  tasks:
    - name: Take the R2 credentials from the source
      ansible.builtin.set_fact:
        voltius_source_db_env: "{{ hostvars[voltius_source].voltius_db_env }}"
      no_log: true

    # A run without a terminal passes voltius_age_key_file, a path on the
    # controller — ideally under /dev/shm, so the key never reaches a disk.
    - name: Put the key in RAM only
      ansible.builtin.copy:
        content: "{{ lookup('file', voltius_age_key_file) if voltius_age_key_file | default('') != '' else voltius_age_key }}\n"
        dest: /dev/shm/voltius-age.key
        mode: "0600"
      no_log: true

    - name: An empty key here fails later, inside a censored task
      ansible.builtin.stat:
        path: /dev/shm/voltius-age.key
      register: voltius_key_stat
      failed_when: voltius_key_stat.stat.size < 60

    # A migration that failed after this point is retried by running the whole
    # playbook again, so an already-restored file is expected, not an error.
    - name: See whether the bundle was already unpacked here
      ansible.builtin.stat:
        path: "{{ voltius_root }}/{{ item }}"
      register: voltius_secret_state
      loop:
        - voltius-server/.env.dockhand
        - voltius-db/.env.db

    - name: Note that the secrets are already in place
      ansible.builtin.debug:
        msg: "secrets already restored on {{ inventory_hostname }}, not unpacking again"
      when: voltius_secret_state.results | map(attribute='stat.exists') | select | list | length == 2

    - name: Unpack the secrets bundle
      when: voltius_secret_state.results | map(attribute='stat.exists') | select | list | length < 2
      ansible.builtin.shell:
        cmd: >-
          AGE_IDENTITY=/dev/shm/voltius-age.key
          R2_BUCKET='{{ voltius_source_db_env.R2_BUCKET }}'
          R2_ENDPOINT='{{ voltius_source_db_env.R2_ENDPOINT }}'
          R2_ACCESS_KEY_ID='{{ voltius_source_db_env.R2_ACCESS_KEY_ID }}'
          R2_SECRET_ACCESS_KEY='{{ voltius_source_db_env.R2_SECRET_ACCESS_KEY }}'
          ROOT='{{ voltius_root }}'
          {{ voltius_root }}/voltius-server/scripts/secrets-bundle.sh unpack
        chdir: "{{ voltius_root }}"
      register: voltius_unpack
      changed_when: true
      no_log: true
      failed_when: false

    - name: Say why the unpack failed, without echoing the command
      ansible.builtin.fail:
        msg: "secrets-bundle.sh unpack failed: {{ voltius_unpack.stderr_lines | default([]) | join(' / ') }}"
      when: voltius_unpack.rc | default(1) != 0

    - name: Delete the key
      ansible.builtin.file:
        path: /dev/shm/voltius-age.key
        state: absent

    - name: The files the target needs must now exist
      ansible.builtin.stat:
        path: "{{ voltius_root }}/{{ item }}"
      register: voltius_restored
      loop:
        - voltius-server/.env.dockhand
        - voltius-db/.env.db
      failed_when: not voltius_restored.stat.exists

    - name: Read the target's copy of .env.db
      ansible.builtin.include_tasks: tasks/read-db-env.yml

    # A drill migrates throwaway hosts: the bundle just restored production's
    # .env.db here, so repoint it before anything starts writing.
    - name: Repoint a drill target at the drill prefixes
      ansible.builtin.include_tasks: tasks/drill-prefixes.yml
      when: voltius_drill_prefix | default("") != ""

- name: Phase 3 — carry the dumps over
  hosts: "{{ voltius_target }}"
  gather_facts: false
  vars:
    voltius_rsync_ssh: >-
      ssh -o StrictHostKeyChecking=accept-new
      {{ '-i ' ~ ansible_ssh_private_key_file if ansible_ssh_private_key_file is defined else '' }}
  tasks:
    # dump-mirror runs `rclone sync`: started against an empty backups/ it would
    # delete every mirrored dump in R2.
    # Through the controller, not source-to-target: the source holds no key for
    # the target, and rsync cannot copy between two remote hosts anyway.
    - name: Make somewhere to stage them
      ansible.builtin.tempfile:
        state: directory
        suffix: voltius-backups
      register: voltius_backup_stage
      delegate_to: localhost

    - name: Pull backups/ off the source
      ansible.builtin.command:
        cmd: >-
          rsync -a --delete -e {{ voltius_rsync_ssh | quote }}
          {{ ('%s@%s:' % (ansible_user, hostvars[voltius_source].ansible_host))
             if hostvars[voltius_source].ansible_connection | default('ssh') != 'local' else '' }}{{ voltius_root }}/voltius-db/backups/
          {{ voltius_backup_stage.path }}/
      delegate_to: localhost
      changed_when: true

    - name: Push them to the target
      ansible.builtin.command:
        cmd: >-
          rsync -a --delete -e {{ voltius_rsync_ssh | quote }} {{ voltius_backup_stage.path }}/
          {{ ('%s@%s:' % (ansible_user, hostvars[voltius_target].ansible_host))
             if hostvars[voltius_target].ansible_connection | default('ssh') != 'local' else '' }}{{ voltius_root }}/voltius-db/backups/
      delegate_to: localhost
      changed_when: true

    - name: Drop the staging copy
      ansible.builtin.file:
        path: "{{ voltius_backup_stage.path }}"
        state: absent
      delegate_to: localhost

- name: Phase 4 — freeze the source (downtime starts)
  hosts: "{{ voltius_source }}"
  gather_facts: false
  tasks:
    - name: Confirm
      ansible.builtin.pause:
        prompt: |
          About to stop production on {{ voltius_source }}.
          Users are offline from here until phase 7. Enter to continue, Ctrl-C A to abort
      when: voltius_confirm | default(true) | bool

    - name: Stop the server
      ansible.builtin.command: docker stop voltius-server
      changed_when: true

    - name: Close the current WAL segment
      ansible.builtin.shell:
        cmd: >-
          docker exec voltius-db psql -U "{{ voltius_db_env.POSTGRES_USER }}"
          -d "{{ voltius_db_env.POSTGRES_DB }}" -tAc 'select pg_switch_wal()'
      register: voltius_switch
      changed_when: true

    - name: Wait until it is archived
      ansible.builtin.shell:
        cmd: >-
          docker exec voltius-db psql -U "{{ voltius_db_env.POSTGRES_USER }}"
          -d "{{ voltius_db_env.POSTGRES_DB }}" -tAc
          "select last_archived_wal >= pg_walfile_name('{{ voltius_switch.stdout | trim }}') and failed_count = 0 from pg_stat_archiver"
      register: voltius_archived
      until: voltius_archived.stdout | trim == "t"
      retries: 30
      delay: 5
      changed_when: false

    # The target promotes onto timeline 2 and archives into the same prefix. Two
    # writers to one archive is unrecoverable, so this stack does not come back.
    - name: Stop the database stack for good
      ansible.builtin.command:
        cmd: docker compose -f compose.db.yml --env-file .env.db stop
        chdir: "{{ voltius_root }}/voltius-db"
      changed_when: true

- name: Phase 5 — restore onto the target
  hosts: "{{ voltius_target }}"
  gather_facts: false
  tasks:
    - name: Restore to the end of the archive
      ansible.builtin.include_tasks: tasks/restore-database.yml
      vars:
        voltius_restore_volume: "{{ voltius_db_volume }}"
        voltius_restore_container: voltius-restore
        voltius_restore_target: LATEST
        voltius_restore_archive_mode: "on"

    - name: Start the database stack
      ansible.builtin.command:
        cmd: docker compose -f compose.db.yml --env-file .env.db up -d
        chdir: "{{ voltius_root }}/voltius-db"
      changed_when: true

    - name: Wait for it to be healthy
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' voltius-db
      register: voltius_db_health
      until: voltius_db_health.stdout | trim == "healthy"
      retries: 30
      delay: 5
      changed_when: false

- name: Phase 6 — start the server on the target
  hosts: "{{ voltius_target }}"
  gather_facts: false
  tasks:
    - name: Pull the pinned image
      ansible.builtin.command:
        cmd: docker compose -p voltius --env-file .env.dockhand -f compose.prod.yml pull -q server
        chdir: "{{ voltius_root }}/voltius-server"
      changed_when: true

    - name: Start it
      ansible.builtin.command:
        cmd: docker compose -p voltius --env-file .env.dockhand -f compose.prod.yml up -d server
        chdir: "{{ voltius_root }}/voltius-server"
      changed_when: true

    - name: Wait for health
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' voltius-server
      register: voltius_server_health
      until: voltius_server_health.stdout | trim == "healthy"
      retries: 30
      delay: 5
      changed_when: false

    - name: Answer locally before any traffic is sent here
      ansible.builtin.uri:
        url: http://127.0.0.1:14372/health
        status_code: 200

    # The connector's token is minted by Cloudflare and exists nowhere until it
    # is asked for. Fetched here rather than kept in OpenTofu state, which holds
    # no secret. A drill skips it: without the DNS change it would serve nobody.
    - name: Read the Cloudflare credentials from the controller
      ansible.builtin.slurp:
        src: "{{ voltius_root }}/voltius-tofu/.env.tofu"
      register: voltius_tofu_env_raw
      delegate_to: localhost
      when: voltius_cutover | default(true) | bool
      no_log: true

    - name: Parse them
      ansible.builtin.set_fact:
        voltius_tofu_env: >-
          {{ dict(voltius_tofu_env_raw.content | b64decode
                  | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)=(.*)$')) }}
      when: voltius_cutover | default(true) | bool
      no_log: true

    - name: Find the voltius-api tunnel
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/accounts/{{ voltius_tofu_env.TF_VAR_account_id }}/cfd_tunnel?name=voltius-api&is_deleted=false
        headers:
          Authorization: "Bearer {{ voltius_tofu_env.CLOUDFLARE_API_TOKEN }}"
      register: voltius_tunnel_lookup
      delegate_to: localhost
      when: voltius_cutover | default(true) | bool
      no_log: true

    - name: Fetch its connector token
      ansible.builtin.uri:
        url: >-
          https://api.cloudflare.com/client/v4/accounts/{{ voltius_tofu_env.TF_VAR_account_id }}/cfd_tunnel/{{ voltius_tunnel_lookup.json.result[0].id }}/token
        headers:
          Authorization: "Bearer {{ voltius_tofu_env.CLOUDFLARE_API_TOKEN }}"
      register: voltius_tunnel_token
      delegate_to: localhost
      when: voltius_cutover | default(true) | bool
      no_log: true

    - name: Write it beside the connector's compose file
      ansible.builtin.copy:
        content: "TUNNEL_TOKEN={{ voltius_tunnel_token.json.result }}\n"
        dest: "{{ voltius_root }}/cloudflared-api/.env"
        mode: "0600"
      when: voltius_cutover | default(true) | bool
      no_log: true

    - name: Start the tunnel connector
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ voltius_root }}/cloudflared-api"
      changed_when: true
      when: voltius_cutover | default(true) | bool

- name: Phase 7 — cut traffic over (downtime ends)
  hosts: "{{ voltius_source }}"
  gather_facts: false
  tasks:
    # A drill migrates two throwaway hosts and must not touch the record that
    # serves users: -e voltius_cutover=false stops here.
    - name: Say that the cutover is being skipped
      ansible.builtin.debug:
        msg: "voltius_cutover is false: api.voltius.app is untouched, {{ voltius_target }} serves nobody"
      when: not (voltius_cutover | default(true) | bool)

    - name: Point api.voltius.app at the new tunnel
      when: voltius_cutover | default(true) | bool
      ansible.builtin.shell:
        cmd: |
          set -eu
          set -a; . {{ voltius_root }}/voltius-tofu/.env.tofu; set +a
          tofu apply -auto-approve -var api_tunnel=voltius-api
        chdir: "{{ voltius_root }}/voltius-tofu/infra/cloudflare"
      changed_when: true

    - name: Check through the tunnel
      ansible.builtin.uri:
        url: https://api.voltius.app/health/deep
        status_code: 200
      retries: 20
      delay: 5
      register: voltius_public_health
      until: voltius_public_health.status == 200
      delegate_to: localhost
      when: voltius_cutover | default(true) | bool

- name: Phase 8 — verify
  hosts: "{{ voltius_target }}"
  gather_facts: false
  tasks:
    - name: Wait for the backup watchdog to pass a full round
      ansible.builtin.shell:
        cmd: docker logs --tail 20 voltius-backup-watch 2>&1 | grep -c 'all checks passed'
      register: voltius_watch
      until: voltius_watch.stdout | int > 0
      retries: 60
      delay: 30
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ voltius_target }} is serving. The old stack is stopped and must stay
          stopped: it would archive a second timeline into the same prefix.
