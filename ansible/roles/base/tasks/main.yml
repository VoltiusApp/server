---
- name: Require a Debian-family host
  ansible.builtin.assert:
    that: ansible_facts.os_family == "Debian"
    fail_msg: "This role targets Ubuntu; found {{ ansible_facts.os_family }}"

- name: Install the packages the stacks need
  become: true
  ansible.builtin.apt:
    name: [age, curl, git, rclone, rsync, tar]
    state: present
    # No cache_valid_time: a cloud image ships package lists whose timestamp is
    # fresh and whose contents are not, so a skipped update means "no such package".
    update_cache: true

- name: Check for docker
  ansible.builtin.command: docker compose version
  register: base_docker_check
  changed_when: false
  failed_when: false

- name: Install docker
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
    executable: /bin/bash
  when: base_docker_check.rc != 0
  changed_when: true

- name: Let the owner use docker without sudo
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  register: base_docker_group

- name: Enable docker
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# The group is granted above but not held by this connection's session yet.
- name: Reset the connection so the docker group applies
  ansible.builtin.meta: reset_connection

- name: Look for the cloudflare network
  ansible.builtin.command: docker network inspect cloudflare --format '{{ "{{" }}(index .IPAM.Config 0).Subnet{{ "}}" }}'
  register: base_network_subnet
  changed_when: false
  failed_when: false

- name: Create the cloudflare network
  ansible.builtin.command: docker network create --subnet {{ voltius_cloudflare_subnet }} cloudflare
  when: base_network_subnet.rc != 0
  changed_when: true

- name: Read the subnet back
  ansible.builtin.command: docker network inspect cloudflare --format '{{ "{{" }}(index .IPAM.Config 0).Subnet{{ "}}" }}'
  register: base_network_subnet
  changed_when: false

- name: Fail on a network that exists with the wrong subnet
  ansible.builtin.assert:
    that: base_network_subnet.stdout | trim == voltius_cloudflare_subnet
    fail_msg: >-
      network cloudflare is {{ base_network_subnet.stdout | trim }},
      expected {{ voltius_cloudflare_subnet }} — TRUSTED_PROXIES names that subnet
