---
# Builds a stand-in for production on a throwaway host, so migrate.yml can be
# run for real without users noticing:
#
#   ansible-playbook drill-seed.yml -e voltius_target=drill-a \
#     -e voltius_age_key_file=/dev/shm/age.key -e voltius_drill_bucket=voltius-drill
#
# Production's prefixes are read exactly once, for the base backup that seeds
# this host. Everything the host writes afterwards — archived WAL, base backups,
# mirrored dumps — goes under voltius-drill/ in the same bucket, because the R2
# credentials are scoped to that bucket and cannot write to another one. The
# watchdog's heartbeat is cleared too, so a drill cannot report production's
# backups healthy.

- name: Read the production R2 credentials locally
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read .env.db
      ansible.builtin.include_tasks: tasks/read-db-env.yml

- name: Seed a stand-in production host
  hosts: "{{ voltius_target }}"
  gather_facts: true
  vars:
    voltius_prod_db_env: "{{ hostvars['localhost'].voltius_db_env }}"
  tasks:
    - name: The drill prefix must not be production's
      ansible.builtin.assert:
        that:
          - voltius_drill_prefix is defined
          - voltius_drill_prefix is search('drill')
          - voltius_drill_prefix not in voltius_prod_db_env.WALG_S3_PREFIX
        fail_msg: "pass -e voltius_drill_prefix=voltius-drill (it must name drill and not be production's)"

    - name: Refuse to seed a host that serves
      ansible.builtin.shell:
        cmd: docker ps -a --filter name=^voltius-server$ --format '{{ "{{" }}.Names{{ "}}" }}'
      register: voltius_seed_guard
      changed_when: false

    - name: Stop if this is a production host
      ansible.builtin.assert:
        that: voltius_seed_guard.stdout == ""
        fail_msg: "{{ inventory_hostname }} has a voltius-server container — seed a throwaway host"

    - name: Put the key in RAM only
      ansible.builtin.copy:
        content: "{{ lookup('file', voltius_age_key_file) }}\n"
        dest: /dev/shm/voltius-age.key
        mode: "0600"
      no_log: true

    - name: Unpack the secrets bundle
      ansible.builtin.shell:
        cmd: >-
          AGE_IDENTITY=/dev/shm/voltius-age.key
          R2_BUCKET='{{ voltius_prod_db_env.R2_BUCKET }}'
          R2_ENDPOINT='{{ voltius_prod_db_env.R2_ENDPOINT }}'
          R2_ACCESS_KEY_ID='{{ voltius_prod_db_env.R2_ACCESS_KEY_ID }}'
          R2_SECRET_ACCESS_KEY='{{ voltius_prod_db_env.R2_SECRET_ACCESS_KEY }}'
          ROOT='{{ voltius_root }}'
          {{ voltius_root }}/voltius-server/scripts/secrets-bundle.sh unpack
        chdir: "{{ voltius_root }}"
      register: voltius_unpack
      changed_when: true
      no_log: true
      failed_when: false

    - name: Say why the unpack failed, without echoing the command
      ansible.builtin.fail:
        msg: "secrets-bundle.sh unpack failed: {{ voltius_unpack.stderr_lines | default([]) | join(' / ') }}"
      when: voltius_unpack.rc | default(1) != 0

    - name: Delete the key
      ansible.builtin.file:
        path: /dev/shm/voltius-age.key
        state: absent

    - name: Read the restored .env.db
      ansible.builtin.include_tasks: tasks/read-db-env.yml

    - name: Restore production into this host, archiving disabled
      ansible.builtin.include_tasks: tasks/restore-database.yml
      vars:
        voltius_restore_volume: "{{ voltius_db_volume }}"
        voltius_restore_container: voltius-drill-restore
        voltius_restore_target: LATEST
        voltius_restore_archive_mode: "off"

    # From here the host is on its own bucket. Everything above read production;
    # nothing below can reach it.
    - name: Repoint this host at the drill prefixes
      ansible.builtin.include_tasks: tasks/drill-prefixes.yml

    - name: Start the database stack
      ansible.builtin.command:
        cmd: docker compose -f compose.db.yml --env-file .env.db up -d
        chdir: "{{ voltius_root }}/voltius-db"
      changed_when: true

    - name: Wait for it to be healthy
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' voltius-db
      register: voltius_seed_db_health
      until: voltius_seed_db_health.stdout | trim == "healthy"
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for the first base backup to reach the drill bucket
      ansible.builtin.shell:
        cmd: docker logs voltius-base-backup 2>&1 | grep -c '\[base-backup\] ok'
      register: voltius_seed_base
      until: voltius_seed_base.stdout | int > 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Start the server
      ansible.builtin.command:
        cmd: docker compose -p voltius --env-file .env.dockhand -f compose.prod.yml up -d server
        chdir: "{{ voltius_root }}/voltius-server"
      changed_when: true

    - name: Wait for it
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' voltius-server
      register: voltius_seed_server_health
      until: voltius_seed_server_health.stdout | trim == "healthy"
      retries: 30
      delay: 5
      changed_when: false

    - name: Ready
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} now stands in for production, archiving under
          {{ voltius_drill_prefix }}/. Migrate it with:
          ansible-playbook migrate.yml -e voltius_source={{ inventory_hostname }}
          -e voltius_target=<other host> -e voltius_cutover=false
